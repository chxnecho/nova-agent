[project]
name = "novaagent"
version = "0.1.0"
description = "NovaAgent - a from-scratch autonomous agent framework with tools, memory, RAG and multi-agent orchestration."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "socksio>=2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
nova = "nova.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
