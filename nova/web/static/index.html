<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaAgent</title>
<script>/* apply saved theme before first paint to avoid flashing */
try { document.documentElement.dataset.theme =
  localStorage.getItem("nova_theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
} catch (e) {}</script>
<style>
  :root {
    --bg: #ffffff; --bg2: #f7f7f8; --panel: #f4f4f6; --border: #e4e4e9;
    --text: #1c1c1e; --dim: #85858b; --accent: #0e9f6e;
    --accent-soft: rgba(14,159,110,.12); --user-bubble: #0e9f6e;
    --red: #dc2626; --orange: #d97706; --blue: #2563eb;
    --code-bg: #f0f0f2; --shadow: 0 4px 24px rgba(0,0,0,.07);
    --radius: 16px;
  }
  [data-theme="dark"] {
    --bg: #101014; --bg2: #17171c; --panel: #1f1f26; --border: #2c2c35;
    --text: #ececf1; --dim: #8f8f99; --accent: #34d399;
    --accent-soft: rgba(52,211,153,.14); --user-bubble: #0d8a60;
    --red: #f87171; --orange: #fbbf24; --blue: #60a5fa;
    --code-bg: #191920; --shadow: 0 4px 24px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; overflow: hidden; font-size: 15px;
    transition: background .25s ease, color .25s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

  /* ---------------- sidebar ---------------- */
  #sidebar {
    width: 264px; flex-shrink: 0; background: var(--bg2);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: margin-left .25s ease;
  }
  #sidebar.hidden { margin-left: -264px; }
  .side-top { padding: 12px 12px 6px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 12px; font-weight: 700; font-size: 15px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; font-size: 14px; }
  #newChat {
    width: 100%; padding: 11px 14px; background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; font-size: 13.5px;
    cursor: pointer; text-align: left; transition: background .15s, border-color .15s;
  }
  #newChat:hover { background: var(--panel); border-color: var(--dim); }
  #convoSearch {
    margin: 8px 12px 0; width: calc(100% - 24px); padding: 8px 12px;
    background: var(--panel); border: 1px solid transparent; border-radius: 10px;
    color: var(--text); font-size: 12.5px; outline: none; transition: border-color .15s;
  }
  #convoSearch:focus { border-color: var(--dim); }
  #convoSearch::placeholder { color: var(--dim); }
  #convoList { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .side-label { font-size: 11px; color: var(--dim); padding: 10px 8px 6px; letter-spacing: .8px; }
  .convo {
    padding: 10px 12px; border-radius: 10px; font-size: 13px; cursor: pointer;
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px; position: relative; transition: background .12s, color .12s;
  }
  .convo:hover, .convo.active { background: var(--panel); color: var(--text); }
  .convo .del {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    opacity: 0; border: none; background: none; color: var(--dim); cursor: pointer; font-size: 13px;
  }
  .convo:hover .del { opacity: 1; }
  .convo .del:hover { color: var(--red); }
  .side-footer { padding: 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--dim); line-height: 1.7; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
    padding: 2px 9px; border-radius: 99px; background: var(--accent-soft);
    color: var(--accent); font-weight: 600;
  }
  .pill.err { background: rgba(239,68,68,.15); color: var(--red); cursor: pointer; }
  .pill.wait { background: rgba(210,153,34,.18); color: var(--orange); }

  /* ---------------- main ---------------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
    border-bottom: 1px solid var(--border);
  }
  #menuBtn, #themeBtn { background: none; border: none; color: var(--text); font-size: 17px; cursor: pointer; padding: 6px; border-radius: 8px; }
  #menuBtn { display: none; }
  #themeBtn:hover, #menuBtn:hover { background: var(--panel); }
  #topbar .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .spacer { flex: 1; }
  #chatWrap { flex: 1; overflow-y: auto; }
  #chat { max-width: 780px; margin: 0 auto; padding: 26px 20px 30px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; animation: fadein .28s ease; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 86%; padding: 11px 16px; border-radius: var(--radius);
    font-size: 15px; line-height: 1.7; word-break: break-word;
  }
  .row.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 6px; }
  .row.bot .bubble { background: var(--panel); border-bottom-left-radius: 6px; }
  .cursor::after { content: "▍"; animation: blink 1s infinite; color: var(--accent); }
  .waiting { align-self: flex-start; color: var(--dim); font-size: 13.5px; padding: 4px 2px; animation: pulse 1.6s ease-in-out infinite; }

  /* markdown */
  .md h1, .md h2, .md h3, .md h4 { margin: 12px 0 6px; line-height: 1.4; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 15px; }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
  .md li { margin: 3px 0; } .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .md blockquote { border-left: 3px solid var(--accent); padding: 2px 12px; margin: 8px 0; color: var(--dim); }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: var(--code-bg); }
  .md a { color: var(--accent); }
  code.ic { background: var(--code-bg); border-radius: 5px; padding: 1.5px 6px; font-size: .88em; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .codeblock { background: var(--code-bg); border-radius: 12px; margin: 10px 0; overflow: hidden; border: 1px solid var(--border); }
  .codehead { display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; font-size: 11.5px; color: var(--dim); border-bottom: 1px solid var(--border); }
  .codehead button { border: none; background: none; color: var(--dim); cursor: pointer; font-size: 11.5px; }
  .codehead button:hover { color: var(--accent); }
  .codeblock pre { padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.55; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .tok-k { color: #c678dd; } .tok-s { color: #98c379; } .tok-c { color: #7f848e; font-style: italic; } .tok-n { color: #d19a66; }

  /* thinking panel */
  details.reasoning {
    margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--code-bg); font-size: 12.5px; overflow: hidden;
  }
  details.reasoning summary {
    cursor: pointer; padding: 7px 12px; color: var(--dim); user-select: none;
    list-style: none; transition: color .15s;
  }
  details.reasoning summary:hover { color: var(--text); }
  .rbody { white-space: pre-wrap; padding: 4px 14px 8px; color: var(--dim); max-height: 180px; overflow-y: auto; line-height: 1.6; }
  .rtlist { padding: 0 10px 10px; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .rtool { background: var(--panel); border-left: 3px solid var(--accent); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; line-height: 1.55; color: var(--dim); }
  .rtool b { color: var(--text); }
  .step { border-left: 3px solid var(--orange); background: var(--code-bg); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; color: var(--dim); white-space: pre-wrap; }
  /* approval card */
  .approve-card { border: 1px solid var(--orange); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: rgba(217,119,6,.07); animation: fadein .25s ease; }
  .approve-card .at { font-weight: 600; font-size: 13.5px; margin-bottom: 5px; }
  .approve-card .ac { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); background: var(--code-bg); border-radius: 8px; padding: 7px 10px; white-space: pre-wrap; max-height: 130px; overflow-y: auto; margin-bottom: 9px; }
  .approve-card .abtns { display: flex; gap: 8px; }
  .approve-card button { border: none; border-radius: 9px; padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600; transition: opacity .15s, transform .1s; }
  .approve-card button:active { transform: scale(.97); }
  .approve-card button.ok { background: var(--accent); color: #fff; }
  .approve-card button.no { background: var(--panel); color: var(--dim); border: 1px solid var(--border); }
  .approve-card.done button { opacity: .45; cursor: default; }
  .approve-card .verdict { font-size: 12px; color: var(--dim); margin-top: 7px; }

  /* meta + message actions */
  .meta { margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 11.5px; color: var(--dim); }
  .msg-actions { display: flex; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity .18s; }
  .bubble:hover .msg-actions { opacity: 1; }
  .msg-actions button { border: none; background: none; color: var(--dim); font-size: 12px; cursor: pointer; padding: 3px 8px; border-radius: 7px; }
  .msg-actions button:hover { background: var(--code-bg); color: var(--text); }

  /* welcome */
  #welcome { max-width: 780px; margin: 0 auto; padding: 60px 20px 30px; text-align: center; }
  #welcome h1 { font-size: 27px; font-weight: 700; margin-bottom: 10px; }
  #welcome p { color: var(--dim); font-size: 14.5px; margin-bottom: 34px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
  .card .ic { font-size: 21px; margin-bottom: 8px; }
  .card .t { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .card .d { color: var(--dim); font-size: 12.5px; line-height: 1.5; }

  /* run status strip + composer */
  #runStatus {
    display: none; max-width: 780px; margin: 0 auto; width: 100%;
    padding: 0 20px 8px; font-size: 12.5px; color: var(--accent); font-weight: 600;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #composerWrap { padding: 0 20px 14px; }
  #composer {
    max-width: 780px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 26px; padding: 10px 12px 10px 20px;
    display: flex; align-items: flex-end; gap: 10px; transition: border-color .15s, box-shadow .15s;
  }
  #composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #input {
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font-size: 15px; line-height: 1.55; resize: none; max-height: 180px;
    font-family: inherit; padding: 7px 0;
  }
  #input::placeholder { color: var(--dim); }
  #sendBtn {
    width: 38px; height: 38px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--accent); color: #fff; font-size: 16px; cursor: pointer;
    display: grid; place-items: center; transition: opacity .15s, background .15s, transform .1s;
  }
  #sendBtn:active { transform: scale(.94); }
  #sendBtn.stop { background: var(--red); }
  .opts { max-width: 780px; margin: 8px auto 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  .switch { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 99px; cursor: pointer; transition: background .18s; }
  .switch .track::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .18s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 16px; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  #backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 15; }
  @media (max-width: 860px) {
    #sidebar { position: fixed; z-index: 20; height: 100%; }
    #sidebar:not(.hidden) { box-shadow: 0 0 60px rgba(0,0,0,.6); }
    #menuBtn { display: block; }
    #backdrop.show { display: block; }
    .bubble { max-width: 94%; }
  }
</style>
</head>
<body>
<div id="backdrop"></div>
<aside id="sidebar">
  <div class="side-top">
    <div class="brand"><span class="logo">✦</span>NovaAgent</div>
    <button id="newChat">＋ 新建对话</button>
  </div>
  <input id="convoSearch" placeholder="🔍 搜索对话…" autocomplete="off">
  <div id="convoList"><div class="side-label">对话记录</div></div>
  <div class="side-footer">
    <div style="margin-bottom:6px"><span class="pill wait" id="statusPill">连接中…</span></div>
    <div id="modelInfo">model: —</div>
    <div id="tokenInfo">tokens: 0</div>
    <div id="verInfo">ui: —</div>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <button id="menuBtn" title="菜单">☰</button>
    <span class="title" id="convTitle">新对话</span>
    <span class="spacer"></span>
    <button id="themeBtn" title="切换深浅色">🌙</button>
  </div>

  <div id="chatWrap">
    <div id="welcome">
      <h1>有什么可以帮你?</h1>
      <p>点一个例子立即体验,NovaAgent 会自主思考、调用工具、验证结果后回答你</p>
      <div class="cards">
        <div class="card" data-prompt="在工作区写一个 Python 脚本统计当前目录各类型文件的数量,并运行验证结果">
          <div class="ic">📊</div><div class="t">分析目录</div>
          <div class="d">编写脚本统计工作区文件类型分布并运行验证</div>
        </div>
        <div class="card" data-prompt="帮我写一个快速排序的实现,附带单元测试并运行证明正确">
          <div class="ic">💻</div><div class="t">写代码 + 测试</div>
          <div class="d">实现算法、写测试、运行验证一条龙</div>
        </div>
        <div class="card" data-prompt="用 Python 生成 100 个随机销售数据,计算平均值和最大值,并用字符画展示前 10 名">
          <div class="ic">📈</div><div class="t">数据分析</div>
          <div class="d">生成数据、统计分析、可视化展示</div>
        </div>
        <div class="card" data-prompt="抓取 https://example.com 的页面内容并总结要点">
          <div class="ic">🌐</div><div class="t">网页总结</div>
          <div class="d">读取网页并提炼核心内容</div>
        </div>
        <div class="card" data-prompt="记住:我们团队的生产环境代号是 nova-prod。然后告诉我你刚才记住了什么">
          <div class="ic">🧠</div><div class="t">长期记忆</div>
          <div class="d">跨会话记住重要事实,随时召回</div>
        </div>
        <div class="card" data-prompt="用通俗的例子给我解释什么是递归,并写一段 Python 代码演示">
          <div class="ic">🎓</div><div class="t">学习助手</div>
          <div class="d">通俗讲解编程概念并配代码示例</div>
        </div>
      </div>
    </div>
    <div id="chat" style="display:none"></div>
  </div>

  <div id="runStatus"></div>

  <div id="composerWrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="输入任务,Enter 发送…"></textarea>
      <button id="sendBtn" title="发送">➤</button>
    </div>
    <div class="opts">
      <label class="switch" title="开启后,执行命令等高风险操作前会先征求你的同意">
        <input type="checkbox" id="confirmToggle" checked><span class="track"></span>
      </label>
      <span>执行命令前先询问我</span>
      <span style="flex:1"></span>
      <span>NovaAgent 可能出错,重要信息请核实 · 请勿发送敏感信息</span>
    </div>
  </div>
</div>
<script src="/static/app.js?v=14"></script>
</body>
</html>
