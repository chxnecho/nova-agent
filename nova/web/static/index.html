<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaAgent</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f7f7f8; --panel: #f4f4f6; --border: #e4e4e9;
    --text: #1c1c1e; --dim: #85858b; --accent: #0e9f6e;
    --accent-soft: rgba(14,159,110,.12); --user-bubble: #0e9f6e;
    --red: #dc2626; --orange: #d97706; --blue: #2563eb;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; overflow: hidden;
  }
  #sidebar {
    width: 264px; flex-shrink: 0; background: var(--bg2);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: margin-left .25s ease;
  }
  #sidebar.hidden { margin-left: -264px; }
  .side-top { padding: 12px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 14px; font-weight: 700; font-size: 15px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; font-size: 14px; }
  #newChat {
    width: 100%; padding: 11px 14px; background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; font-size: 13.5px;
    cursor: pointer; text-align: left; transition: background .15s, border-color .15s;
  }
  #newChat:hover { background: var(--panel); border-color: var(--dim); }
  #convoList { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .side-label { font-size: 11px; color: var(--dim); padding: 10px 8px 6px; text-transform: uppercase; letter-spacing: .8px; }
  .convo {
    padding: 10px 12px; border-radius: 10px; font-size: 13px; cursor: pointer;
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px; position: relative; transition: background .12s, color .12s;
  }
  .convo:hover { background: var(--panel); color: var(--text); }
  .convo.active { background: var(--panel); color: var(--text); }
  .convo .del {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    opacity: 0; border: none; background: none; color: var(--dim); cursor: pointer; font-size: 13px;
  }
  .convo:hover .del { opacity: 1; }
  .convo .del:hover { color: var(--red); }
  .side-footer { padding: 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--dim); line-height: 1.7; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
    padding: 2px 9px; border-radius: 99px; background: var(--accent-soft);
    color: var(--accent); font-weight: 600;
  }
  .pill.err { background: rgba(239,68,68,.15); color: var(--red); cursor: pointer; }
  .pill.wait { background: rgba(210,153,34,.15); color: var(--orange); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px;
    border-bottom: 1px solid var(--border);
  }
  #menuBtn { display: none; background: none; border: none; color: var(--text); font-size: 19px; cursor: pointer; }
  #topbar .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .spacer { flex: 1; }
  #chatWrap { flex: 1; overflow-y: auto; }
  #chat { max-width: 780px; margin: 0 auto; padding: 26px 20px 30px; display: flex; flex-direction: column; gap: 22px; }

  #welcome { max-width: 720px; margin: 0 auto; padding: 9vh 24px 24px; text-align: center; }
  #welcome h1 { font-size: 27px; font-weight: 700; margin-bottom: 10px; }
  #welcome p { color: var(--dim); font-size: 14.5px; margin-bottom: 34px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align: left; cursor: pointer; transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .ic { font-size: 20px; margin-bottom: 8px; }
  .card .t { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .card .d { font-size: 12px; color: var(--dim); line-height: 1.5; }
  .row { display: flex; gap: 13px; animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .row.user { justify-content: flex-end; }
  .bubble {
    min-width: 0; max-width: 86%; font-size: 14.5px; line-height: 1.7;
    padding: 11px 16px;
  }
  .row.user .bubble {
    background: var(--user-bubble); color: #fff;
    border-radius: 18px 18px 5px 18px;
    white-space: pre-wrap; word-break: break-word;
  }
  .row.bot .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 5px 18px 18px 18px;
  }

  .md p { margin: 0 0 10px; } .md p:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 16px 0 8px; line-height: 1.35; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
  .md ul, .md ol { margin: 4px 0 10px 22px; }
  .md li { margin-bottom: 4px; }
  .md blockquote { border-left: 3px solid var(--accent); padding: 2px 12px; margin: 8px 0; color: var(--dim); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .md a { color: var(--blue); }
  .md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 11px; text-align: left; }
  .md th { background: var(--panel); }
  .ic { background: rgba(255,255,255,.09); border-radius: 5px; padding: 2px 6px;
        font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .88em; }
  .codeblock { margin: 10px 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #0d1117; }
  .codehead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 14px; background: rgba(255,255,255,.04); font-size: 11.5px; color: var(--dim);
  }
  .codehead button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 11.5px; }
  .codehead button:hover { color: var(--text); }
  .codeblock pre { padding: 13px 16px; overflow-x: auto; }
  .codeblock code { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.8px; line-height: 1.6; }
  .tok-k { color: #ff7b72; } .tok-s { color: #a5d6ff; } .tok-c { color: #8b949e; font-style: italic; } .tok-n { color: #79c0ff; }

  .steps { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  details.reasoning { border: 1px dashed var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; }
  details.reasoning summary { cursor: pointer; color: var(--dim); user-select: none; }
  details.reasoning .rbody { margin-top: 7px; color: var(--dim); white-space: pre-wrap; word-break: break-word; font-style: italic; max-height: 140px; overflow-y: auto; }
  details.reasoning .rtlist { margin-top: 7px; }
  details.reasoning .rtool {
    color: var(--dim); font-size: 12px; padding: 5px 2px;
    border-top: 1px dashed var(--border);
    white-space: pre-wrap; word-break: break-word;
  }
  details.reasoning .rtool b { color: var(--text); }
  .step {
    font-size: 12.5px; color: var(--dim); background: var(--panel);
    border: 1px solid var(--border); border-left: 3px solid var(--orange);
    border-radius: 9px; padding: 7px 11px; white-space: pre-wrap; word-break: break-word;
  }
  .step b { color: var(--text); font-weight: 600; }
  .cursor::after { content: "▍"; animation: blink 1s infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .waiting {
    align-self: flex-start; color: var(--dim); font-size: 13px;
    padding: 4px 2px; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

  #composerWrap { padding: 0 20px 18px; }
  #composer {
    max-width: 780px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 26px; padding: 10px 12px 10px 20px;
    display: flex; align-items: flex-end; gap: 10px; transition: border-color .15s;
  }
  #composer:focus-within { border-color: var(--dim); }
  #input {
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font-size: 14.5px; line-height: 1.55; resize: none; max-height: 180px;
    font-family: inherit; padding: 7px 0;
  }
  #input::placeholder { color: var(--dim); }
  #sendBtn {
    width: 38px; height: 38px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--accent); color: #fff; font-size: 16px; cursor: pointer;
    display: grid; place-items: center; transition: opacity .15s, background .15s;
  }
  #sendBtn:disabled { opacity: .35; cursor: not-allowed; }
  #sendBtn.stop { background: var(--red); }
  .hint { text-align: center; font-size: 11px; color: var(--dim); margin-top: 9px; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 860px) {
    #sidebar { position: fixed; z-index: 20; height: 100%; }
    #sidebar:not(.hidden) { box-shadow: 0 0 60px rgba(0,0,0,.6); }
    #menuBtn { display: block; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="side-top">
    <div class="brand">NovaAgent</div>
    <button id="newChat">＋ 新建对话</button>
  </div>
  <div id="convoList"><div class="side-label">对话记录</div></div>
  <div class="side-footer">
    <div style="margin-bottom:6px"><span class="pill wait" id="statusPill">连接中…</span></div>
    <div id="modelInfo">model: —</div>
    <div id="tokenInfo">tokens: 0</div>
    <div id="verInfo">ui: —</div>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <button id="menuBtn">☰</button>
    <span class="title" id="convTitle">新对话</span>
    <span class="spacer"></span>
  </div>

  <div id="chatWrap">
    <div id="welcome">
      <h1>有什么可以帮你?</h1>
      <p>NovaAgent 会自主思考、调用工具、验证结果后回答你</p>
      <div class="cards">
        <div class="card" data-prompt="在工作区写一个 Python 脚本统计当前目录各类型文件的数量,并运行验证结果">
          <div class="ic">📊</div><div class="t">分析目录</div>
          <div class="d">编写脚本统计工作区文件类型分布并运行验证</div>
        </div>
        <div class="card" data-prompt="帮我写一个快速排序的实现,附带单元测试并运行证明正确">
          <div class="ic">💻</div><div class="t">写代码 + 测试</div>
          <div class="d">实现算法、写测试、运行验证一条龙</div>
        </div>
        <div class="card" data-prompt="抓取 https://example.com 的页面内容并总结要点">
          <div class="ic">🌐</div><div class="t">网页抓取</div>
          <div class="d">读取网页并总结核心内容</div>
        </div>
        <div class="card" data-prompt="记住:我们团队的生产环境代号是 nova-prod。然后告诉我你刚才记住了什么">
          <div class="ic">🧠</div><div class="t">长期记忆</div>
          <div class="d">跨会话记住重要事实,随时召回</div>
        </div>
      </div>
    </div>
    <div id="chat" style="display:none"></div>
  </div>

  <div id="composerWrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="给 NovaAgent 发送任务… (Enter 发送 / Shift+Enter 换行)"></textarea>
      <button id="sendBtn" title="发送">➤</button>
    </div>
    <div class="hint">NovaAgent 可能会调用文件 / 命令 / 网络工具来完成任务,请勿发送敏感信息</div>
  </div>
</div>
<script src="/static/app.js?v=12"></script>
</body>
</html>
